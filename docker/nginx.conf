worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/xml
    image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Config injetada em runtime — nunca deve ficar em cache.
    location = /env-config.js {
      add_header Cache-Control "no-store, no-cache, must-revalidate";
      try_files /env-config.js =404;
    }

    # index.html também não deve ser cacheado, pois referencia os assets com hash.
    location = /index.html {
      add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Assets com hash no nome (JS/CSS/imagens do build) podem ser cacheados por muito tempo.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # SPA fallback: qualquer rota desconhecida cai no index.html (React Router cuida do resto).
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
